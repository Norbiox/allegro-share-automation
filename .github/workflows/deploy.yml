name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C /opt/allegro-share-automation pull

      - name: Sync dependencies
        run: uv sync --frozen
        working-directory: /opt/allegro-share-automation

      - name: Restart service
        run: sudo systemctl restart allegro-share

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/health; then
              echo "Service is up"
              exit 0
            fi
            sleep 2
          done
          echo "Health check timed out" >&2
          exit 1
